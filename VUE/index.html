<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 内容安全策略兜底：限制脚本源，禁止内联脚本执行，缓解 XSS。
         前端主题预设使用外部 JS 文件，故无需 'unsafe-inline'。 -->
    <!-- media-src 必须显式声明：语音播报用 blob: 承载合成的音频，
         未声明时会回退到 default-src 'self' 而被拦截（表现为"请求 200 却没声音"）。
         data: 用于移动端的静音解锁片段。 -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#faf7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191613" media="(prefers-color-scheme: dark)" />
    <!-- 资源提示：提前建立 API 连接，缩短接口首包时延 -->
    <link rel="preconnect" href="/" crossorigin />
    <title>心语</title>
    <style>
      /* 首屏底色：JS 包下载/解析完成前先铺满，避免白屏闪烁 */
      html { background: #faf7f4; color-scheme: light; }
      html.dark { background: #191613; color-scheme: dark; }
      body { margin: 0; background: #faf7f4; }
      html.dark body { background: #191613; }

      /* 启动骨架屏：Vue 挂载后由真实页面替换 */
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #faf7f4;
        z-index: 9999;
      }
      html.dark .app-boot { background: #191613; }
      .app-boot-mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(135deg, #e07c5a 0%, #cf5a47 100%);
        animation: app-boot-pulse 1.25s ease-in-out infinite;
      }
      .app-boot-bar {
        width: 132px;
        height: 3px;
        border-radius: 3px;
        background: #e7ded6;
        overflow: hidden;
      }
      html.dark .app-boot-bar { background: #3a332b; }
      .app-boot-bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #d96c4e;
        animation: app-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-boot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(0.9); opacity: 0.62; }
      }
      @keyframes app-boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-mark, .app-boot-bar > i { animation: none; }
      }
    </style>
    <!-- 首屏同步应用主题：外部脚本（CSP 不允许内联脚本） -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="app">
      <div class="app-boot">
        <div class="app-boot-mark"></div>
        <div class="app-boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
