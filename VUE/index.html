<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#191613" media="(prefers-color-scheme: dark)" />
    <title>心语</title>
    <style>
      /* 首屏底色：JS 包下载/解析完成前先铺满，避免白屏闪烁 */
      html { background: #faf7f4; color-scheme: light; }
      html.dark { background: #191613; color-scheme: dark; }
      body { margin: 0; background: #faf7f4; }
      html.dark body { background: #191613; }

      /* 启动骨架屏：Vue 挂载后由真实页面替换 */
      .app-boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #faf7f4;
        z-index: 9999;
      }
      html.dark .app-boot { background: #191613; }
      .app-boot-mark {
        width: 46px;
        height: 46px;
        border-radius: 14px;
        background: linear-gradient(135deg, #e07c5a 0%, #cf5a47 100%);
        animation: app-boot-pulse 1.25s ease-in-out infinite;
      }
      .app-boot-bar {
        width: 132px;
        height: 3px;
        border-radius: 3px;
        background: #e7ded6;
        overflow: hidden;
      }
      html.dark .app-boot-bar { background: #3a332b; }
      .app-boot-bar > i {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 3px;
        background: #d96c4e;
        animation: app-boot-slide 1.1s ease-in-out infinite;
      }
      @keyframes app-boot-pulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(0.9); opacity: 0.62; }
      }
      @keyframes app-boot-slide {
        0% { transform: translateX(-110%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-boot-mark, .app-boot-bar > i { animation: none; }
      }
    </style>
    <script>
      // 在 CSS/JS 资源加载前同步应用缓存主题，消除首屏闪白/闪黑
      (function () {
        try {
          var t = localStorage.getItem('chatbot_theme') || 'auto';
          var dark = t === 'dark' ||
            (t !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app">
      <div class="app-boot">
        <div class="app-boot-mark"></div>
        <div class="app-boot-bar"><i></i></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
